<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Заголовок страницы</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<h1 class="text-center">Заголовок</h1>
<div class="row">
    <div class="col-2"></div>
    <div class="col-8">
        <div class="row">
            <div class="col-12">
                <a class="btn btn-link" href="https://my.sky.pro">Личный кабинет</a>
            </div>
            <div class="col-12">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnvrJD42AAB1m7saq6ravg9lTDMNtAWsiKHA&s"
                     class="img-thumbnail rounded mx-auto d-block" alt="...">
            </div>
            <div class="col-12 mt-3">
               <form>
                  <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Почта</label>
                    <input placeholder="email@example.com" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                    <div id="emailHelp" class="form-text">Мы никогда не передадим ваш адрес электронной почты кому-либо еще.</div>
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Имя</label>
                    <input placeholder="Иван Иванов" type="text" class="form-control" id="exampleInputPassword1">
                  </div>
                  <button type="submit" class="btn btn-primary">Отправить</button>
                </form>
            </div>
            <div class="col-12 mt-5">
                <select class="form-select form-select-lg mb-3" aria-label="Large select example">
                  <option selected>Открыть меню</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                </select>

                <select class="form-select form-select-sm" aria-label="Small select example">
                  <option selected>Open this select menu</option>
                  <option value="1">One</option>
                  <option value="2">Two</option>
                  <option value="3">Three</option>
                </select>
            </div>
            <div class="col-12 mt-5">
                <div class="list-group">
                  <button type="button" class="list-group-item list-group-item-action active" aria-current="true">
                    The current button
                  </button>
                  <button type="button" class="list-group-item list-group-item-action">A second button item</button>
                  <button type="button" class="list-group-item list-group-item-action">A third button item</button>
                  <button type="button" class="list-group-item list-group-item-action">A fourth button item</button>
                  <button type="button" class="list-group-item list-group-item-action" disabled>A disabled button item</button>
                </div>
            </div>
            <div class="col-12 mt-5">
                <table class="table table-striped">
                   <thead>
                    <tr>
                      <th scope="col">#</th>
                      <th scope="col">First</th>
                      <th scope="col">Last</th>
                      <th scope="col">Handle</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <th scope="row">1</th>
                      <td>Mark</td>
                      <td>Otto</td>
                      <td>@mdo</td>
                    </tr>
                    <tr>
                      <th scope="row">2</th>
                      <td>Jacob</td>
                      <td>Thornton</td>
                      <td>@fat</td>
                    </tr>
                    <tr>
                      <th scope="row">3</th>
                      <td>John</td>
                      <td>Doe</td>
                      <td>@social</td>
                    </tr>
                  </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="col-2"></div>
</div>
</body>
</html>
