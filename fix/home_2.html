<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet" />
<body>
<div class="row">
    <div class="col-2">
        <div class="list-group">
  <a href="#" class="list-group-item list-group-item-action active" aria-current="true">
    <i class="bi bi-house"></i> Главная
  </a>
  <a href="#" class="list-group-item list-group-item-action">
    <i class="bi bi-journal"></i> Категории
  </a>
  <a href="#" class="list-group-item list-group-item-action">
    <i class="bi bi-card-checklist"></i> Заказы
  </a>
  <a href="#" class="list-group-item list-group-item-action">
    <i class="bi bi-person"></i> Контакты
  </a>
</div>
    </div>
    <div class="col-8">
        <div class="row mt-5">
            <div class="col-7">
                <div class="card text-bg-primary">
                  <div class="card-body">
                    <h2>Контактные данные:</h2>
                    <div class="row">
                        <div class="col-6">Москва</div>
                        <div class="col-6">+7 777 777 7777</div>
                    </div>
                    <div class="row">
                        <div class="col-6">Санкт-Петербург</div>
                        <div class="col-6">+7 888 888 8888</div>
                    </div>
                  </div>
                </div>


            </div>
            <div class="col-5">
                <div class="card text-bg-secondary">
                    <div class="card-body">
                        <form>
                            <h2>Оставьте заявку</h2>
                            <div class="mb-3">

                                <input type="text" class="form-control" placeholder="Имя">
                            </div>
                            <div class="mb-3">

                                <input type="email" class="form-control" placeholder="e-mail">
                            </div>

                            <div class="mb-3">

                                <textarea class="form-control" placeholder="Сообщение" rows="5"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Отправить</button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="col-2"></div>
</div>
</body>
</html>
