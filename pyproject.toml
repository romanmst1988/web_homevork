[project]
name = "coursework-with-db"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mypy (>=1.11)",
    "pandas (>=2.3.2,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "coverage (>=7.10.6,<8.0.0)",
    "private-package (>=1.1.1,<2.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "self (>=2020.12.3,<2021.0.0)"
]

[tool.poetry]
packages = [{include = "coursework_with_db", from = "src"}]


[tool.poetry.group.linter.dependencies]
flake8 = "^7.3.0"
black = "^25.1.0"
mypy = "^1.18.1"
isort = "^6.0.1"


[tool.poetry.group.dev.dependencies]
requests = "^2.32.5"
pytest-cov = "^7.0.0"
pytest = "^8.4.2"
pytest-mock = "^3.15.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv|.venv'

[tool.black]
line-length = 119
exclude = """ \\.git """

[tool.isort]
line_length = 119
